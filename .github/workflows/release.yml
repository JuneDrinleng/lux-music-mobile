# 开发版：push dev → tag vX.Y.Z-dev.N 预发布 + 10 个 APK，并更新 master 上 version.json 的 dev 字段。
# 打包前把本次说明写入 src/data/bundledChangelog.json。生成失败只留空说明，不阻断 APK、versionCode 或 version.json。
# 稳定版：push master → tag vX.Y.Z 正式 Release。package.json 版本对应的 tag 已存在则整条跳过，
# 因此合并本引导改动（版本仍是 0.3.1，tag v0.3.1 已存在）不会发版，也不会覆盖已有 APK。
# 补发：Actions → Release → Run workflow，tag 填「有 tag、没有 Release」的版本。已有 Release 会直接失败。
name: Release

on:
  push:
    branches: [dev, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'publish/version.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      tag:
        description: '补发：为「有 tag、无 Release」的版本建 Release（如 v0.4.0-dev.3）。留空则按当前分支正常发布'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
      prerelease: ${{ steps.p.outputs.prerelease }}
      prev_tag: ${{ steps.p.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_IN:-}" ]; then
            case "$TAG_IN" in
              v*) ;;
              *) echo "tag 必须以 v 开头：$TAG_IN" >&2; exit 1 ;;
            esac
            git rev-parse -q --verify "refs/tags/${TAG_IN}" >/dev/null || { echo "tag 不存在：${TAG_IN}" >&2; exit 1; }
            if gh release view "$TAG_IN" >/dev/null 2>&1; then
              echo "${TAG_IN} 已有 Release，禁止覆盖" >&2
              exit 1
            fi
            version="${TAG_IN#v}"
            node --input-type=module -e 'import { assertEncodable } from "./scripts/version-code.mjs"; assertEncodable(process.argv[1])' "$version"
            pre=false
            case "$version" in
              *-dev.*) pre=true ;;
            esac
            {
              echo "skip=false"
              echo "version=${version}"
              echo "tag=${TAG_IN}"
              echo "prerelease=${pre}"
              echo "prev_tag="
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/next-version.mjs "$GITHUB_REF_NAME"
          fi

      - name: 确认签名密钥已配置
        if: steps.p.outputs.skip == 'false'
        env:
          KS_B64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KS_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "缺少 secret KEYSTORE_STORE_FILE_BASE64"; exit 1; }
          test -n "$KS_FILE" || { echo "缺少 secret KEYSTORE_STORE_FILE"; exit 1; }
          test -n "$KS_ALIAS" || { echo "缺少 secret KEYSTORE_KEY_ALIAS"; exit 1; }
          test -n "$KS_PASS" || { echo "缺少 secret KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASS" || { echo "缺少 secret KEYSTORE_KEY_PASSWORD"; exit 1; }
          case "$KS_FILE" in
            *[/\\]*|.*) echo "KEYSTORE_STORE_FILE 必须是文件名，不能包含路径"; exit 1 ;;
          esac

      - name: 占号（先推 tag，构建失败也不会重用这个版本号）
        if: steps.p.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
        env:
          TAG: ${{ steps.p.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

  build:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: 写入安装包内的更新日志
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRE: ${{ needs.plan.outputs.prerelease }}
          PREV: ${{ needs.plan.outputs.prev_tag }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/write-bundled-changelog.mjs ]; then
            echo "当前 tag 没有更新日志脚本，跳过（旧版本补发）"
            exit 0
          fi
          if [ "$PRE" != true ]; then
            node scripts/write-bundled-changelog.mjs stable "$VERSION" --allow-empty
            exit 0
          fi
          json_file="${RUNNER_TEMP:-/tmp}/generate-notes.json"
          rm -f notes.md
          gen_ok=false
          if [ -n "${PREV:-}" ]; then
            if gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/releases/generate-notes" \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${TAG}" \
              -f "previous_tag_name=${PREV}" > "$json_file"; then
              gen_ok=true
            fi
          else
            if gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/releases/generate-notes" \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${TAG}" > "$json_file"; then
              gen_ok=true
            fi
          fi
          if [ "$gen_ok" = true ] && node scripts/write-bundled-changelog.mjs dev "$VERSION" --github-json "$json_file" --notes-out notes.md; then
            echo "开发版日志与 GitHub generate-notes 一致"
          else
            echo "::warning::generate-notes 失败，安装包内日志改用提交标题；Release 正文仍走 --generate-notes"
            rm -f notes.md
            subjects="${RUNNER_TEMP:-/tmp}/commit-subjects.txt"
            : > "$subjects"
            if [ -n "${PREV:-}" ]; then
              gh api "/repos/${REPO}/compare/${PREV}...${TAG}" --jq '.commits[].commit.message' > "$subjects" || true
            fi
            if [ -s "$subjects" ]; then
              node scripts/write-bundled-changelog.mjs dev "$VERSION" --subjects "$subjects" --allow-empty
            else
              node scripts/write-bundled-changelog.mjs dev "$VERSION" --allow-empty
            fi
          fi

      - name: 注入版本并签名构建 standard + vivo
        env:
          DISABLE_SVG: 1
          VERSION: ${{ needs.plan.outputs.version }}
          KS_B64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KS_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KS_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          npm pkg set version="$VERSION"
          cd android
          case "$KS_FILE" in
            *[/\\]*|.*) echo "KEYSTORE_STORE_FILE 必须是文件名"; exit 1 ;;
          esac
          trap 'rm -f "app/${KS_FILE}"' EXIT
          echo "$KS_B64" | base64 --decode > "app/${KS_FILE}"
          [ -s "app/${KS_FILE}" ] || { echo "keystore 解码后为空"; exit 1; }
          ./gradlew --no-daemon --stacktrace --max-workers=2 assembleStandardRelease assembleVivoRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$KS_FILE" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KS_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$KS_PASS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASS" || {
            echo "Gradle failed, dumping crash logs..."
            find . -maxdepth 2 -name "hs_err_pid*.log" -print -exec cat {} \;
            if [ -d "${HOME}/.gradle/daemon" ]; then
              find "${HOME}/.gradle/daemon" -name "daemon-*.out.log" -print -exec tail -n 200 {} \;
            fi
            exit 1
          }

      - name: 创建 Release（先 draft，传完资产再发布；已有 Release 不会被覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRE: ${{ needs.plan.outputs.prerelease }}
          PREV: ${{ needs.plan.outputs.prev_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find android/app/build/outputs/apk -path '*release*' -name '*.apk' -exec cp {} dist/ \;
          count="$(find dist -name '*.apk' | wc -l)"
          [ "$count" = 10 ] || { find dist -name '*.apk'; echo "APK 数量是 ${count}，不是 10"; exit 1; }
          (cd dist && md5sum *.apk > MD5SUMS.txt)
          if [ "$PRE" = true ]; then
            args=(--verify-tag --title "${TAG}（开发版）" --prerelease --latest=false)
            if [ -s notes.md ]; then
              args+=(--notes-file notes.md)
            else
              args+=(--generate-notes)
              if [ -n "$PREV" ]; then
                args+=(--notes-start-tag "$PREV")
              fi
            fi
            gh release create "$TAG" dist/* "${args[@]}"
          else
            node --input-type=module -e '
              import fs from "node:fs"
              import { changelogSection } from "./scripts/update-feed.mjs"
              fs.writeFileSync("notes.md", changelogSection(process.env.VERSION) + "\n")
            '
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi

  feed:
    needs: [plan, build]
    if: always() && needs.plan.outputs.skip == 'false' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 更新 publish/version.json（只写 master，APK 上传成功之后）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          apply() {
            if [ "$PRE" = true ]; then
              gh release view "$TAG" --json body -q .body > /tmp/notes.md
              node scripts/update-feed.mjs dev "$VERSION" /tmp/notes.md
            else
              node scripts/update-feed.mjs stable "$VERSION"
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            apply
            if git diff --quiet -- publish/version.json; then
              echo "version.json 无变化"
              exit 0
            fi
            git add publish/version.json
            git commit -m "chore: 更新 version.json（${TAG}）"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "推送 version.json 失败，重试 ${attempt}"
            sleep 5
          done
          exit 1
